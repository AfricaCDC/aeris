# AERIS – local / single-server deployment (app + MariaDB).
# Run from aeris/docker:   docker compose up -d --build
# Then open http://localhost:8080/openboxes  (put nginx + HTTPS in front in production)
name: aeris

services:
  app:
    build:
      context: ../..
      dockerfile: aeris/docker/Dockerfile
    image: ${AERIS_IMAGE:-aeris:0.9.8-acdc22}
    container_name: aeris-app
    restart: unless-stopped
    ports:
      - "${AERIS_PORT:-8080}:8080"
    environment:
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-openboxes}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
      DATASOURCE_URL: ${DATASOURCE_URL:-jdbc:mysql://db/openboxes?serverTimezone=UTC&useSSL=false}
      GRAILS_SERVER_URL: ${GRAILS_SERVER_URL:-http://localhost:8080/openboxes/}
      # true when AERIS sits behind an HTTPS proxy or tunnel (nginx, Cloudflare): trust X-Forwarded-Proto
      SERVER_USE_FORWARD_HEADERS: ${SERVER_USE_FORWARD_HEADERS:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms1024m -Xmx2048m -XX:+UseParallelGC -Djava.awt.headless=true}
      # Microsoft 365 sign-in (Entra ID app registration by Africa CDC IT). Put the values in .env, never here.
      AERIS_ENTRA_ENABLED: ${AERIS_ENTRA_ENABLED:-false}
      AERIS_ENTRA_TENANT_ID: ${AERIS_ENTRA_TENANT_ID:-}
      AERIS_ENTRA_CLIENT_ID: ${AERIS_ENTRA_CLIENT_ID:-}
      AERIS_ENTRA_CLIENT_SECRET: ${AERIS_ENTRA_CLIENT_SECRET:-}
      AERIS_ENTRA_REDIRECT_URI: ${AERIS_ENTRA_REDIRECT_URI:-}
      AERIS_ENTRA_EMAIL_DOMAINS: ${AERIS_ENTRA_EMAIL_DOMAINS:-africacdc.org}
      # Testing only (aeris/tools/dev_mock_entra.py); leave unset in production
      AERIS_ENTRA_AUTHORITY: ${AERIS_ENTRA_AUTHORITY:-}
      AERIS_ENTRA_ALLOW_HTTP: ${AERIS_ENTRA_ALLOW_HTTP:-false}
    volumes:
      # Africa CDC settings (logo, language, mail, reason codes). Survives image upgrades.
      - ./openboxes.yml:/app/.grails/openboxes.yml:ro
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: aeris-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: openboxes
      MYSQL_USER: ${DATASOURCE_USERNAME:-openboxes}
      MYSQL_PASSWORD: ${DATASOURCE_PASSWORD:-openboxes}
    # utf8 as in the OpenBoxes install guide, so French names (é, è, à) are stored correctly
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db:
  uploads:
