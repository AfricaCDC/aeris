# AERIS external configuration, mounted at /app/.grails/openboxes.yml.
# Values here override the defaults baked into the image (grails-app/conf/application.yml).
# Keep deployment-specific settings here: server URL, mail server, logo URLs.
openboxes:
  logo:
    # Default: the AERIS mark shipped in the image. To use the official Africa CDC logo,
    # host it on the server and point these URLs at it.
    url: "/openboxes/assets/aeris_logo_40x40.png"
    label: "Riposte Ebola"
  report:
    logo:
      url: "/openboxes/assets/aeris_logo_100.png"
  locale:
    defaultLocale: 'fr'
    supportedLocales: ['fr', 'en']
    defaultCurrencyCode: "USD"
    supportedCurrencyCodes: ["USD", "EUR"]
  signup:
    enabled: false
  mail:
    errors:
      recipients: ["aeris-support@africacdc.org"]   # to confirm with Africa CDC IT

grails:
  i18n:
    defaultLocale: fr
  mail:
    host: "smtp.example.org"          # Africa CDC SMTP server
    port: 587
    from: "stocks-ebola@africacdc.org" # proposal, to be created by Africa CDC IT
